spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/south_trails_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET:replace-this-with-a-long-random-production-secret}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.admin.email=${ADMIN_EMAIL:admin@southtrails.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
