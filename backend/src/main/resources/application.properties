spring.application.name=south-trails-api
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/south-trails-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:south-trails-local-development-secret-change-in-prod}
app.jwt.expiration-seconds=86400
app.admin.email=${ADMIN_EMAIL:admin@southtrails.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

spring.jackson.property-naming-strategy=SNAKE_CASE

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swaggerui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
